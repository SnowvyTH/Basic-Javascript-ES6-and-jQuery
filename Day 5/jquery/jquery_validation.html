<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>jQuery Validation</title>
    <style>
        .login-error-valid {
            color: red;
            font-size: 14px;
        }
    </style>
</head>
<body>

    <form action="jquery_validation.html" id="register">
        <div>
            <label for="">Fullname</label>
            <input type="text" name="fullname" id="fullname">
        </div>

        <div>
            <label for="">Email</label>
            <input type="email" name="email" id="email">
        </div>

        <div>
            <label for="">Tel</label>
            <input type="tel" name="tel" id="tel">
        </div>

        <div>
            <button type="submit">Submit</button>
        </div> 
    </form>

    
    <script src="jquery-3.7.1.min.js"></script>
    <script src="jQuery_validate/jquery.validate.min.js"></script>
    <script>
        $("form#register").validate({
            rules: {
                fullname: {
                    required: true
                },
                email: {
                    required: true,
                    email: true
                },
                tel: {
                    required: true
                }
            },
            messages: {
                fullname: {
                    required: "ต้องกรอกชื่อ-นามสกุล"
                },
                email: {
                    required: "ต้องกรอกอีเมล",
                    email: "รูปแบบอีเมลไม่ถูกต้อง"
                },
                tel: {
                    required: "ต้องกรอกเบอร์โทรศัพท์"
                }
            },
            errorClass: "login-error-valid",
            errorPlacement: function(error, element) {
                error.appendTo(element.parent())
                //error.appendTo(".help-block")
            },
            submitHandler: function(form) {

            }
        })
    </script>
</body>
</html>
